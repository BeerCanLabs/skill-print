[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-print"
version = "1.0.0"
description = "Print skill for BeerCanLabs Agent Factory: send documents, text, and URLs to the home office printer via the Gatekeeper print route."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "BeerCanLabs", email = "ops@beercanlabs.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["print_skill*"]
